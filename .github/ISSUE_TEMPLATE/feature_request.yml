name: Feature Request
description: Suggest an improvement or new capability for x11.zig
title: "[Feature]: "
labels:
  - enhancement

body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement to x11.zig.

        For significant changes, consider discussing the idea before investing substantial implementation effort.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem or limitation would this feature address?
      placeholder: Describe the problem you are trying to solve.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: Describe the change or capability you would like to see.
      placeholder: Describe your proposed solution.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions, APIs, or approaches you have considered.
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context, examples, references, or relevant information.
    validations:
      required: false
